<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PI WEB</title>
    <meta name="theme-color" content="#0d1117" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
  </head>
  <body>
    <!-- Pre-paint theme boot (DSH model): light = default body,
         dark = body[data-ds-dark-theme]. Reads the same storage key the
         legacy client uses so a user's saved preference carries over.
         Runs before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var KEY = "pi-web-app-theme";
          var raw = localStorage.getItem(KEY);
          var pref = raw ? JSON.parse(raw) : null;
          var auto = !pref || pref.auto !== false;
          var id = pref && typeof pref.themeId === "string" ? pref.themeId : "";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = auto ? prefersDark : !/light/i.test(id);
          if (dark) document.body.setAttribute("data-ds-dark-theme", "");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* first-run / private mode: fall back to default (light) */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
